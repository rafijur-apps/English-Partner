<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner safe zone decorative glow -->
  <circle cx="256" cy="256" r="180" fill="#38BDF8" opacity="0.08" />

  <!-- Main Speech Bubble Shape -->
  <g filter="url(#shadow)">
    <path d="M 120 160 C 120 125 145 100 180 100 L 332 100 C 367 100 392 125 392 160 L 392 280 C 392 315 367 340 332 340 L 220 340 L 150 395 C 140 403 125 395 125 382 L 125 340 C 120 340 120 325 120 310 Z" fill="url(#accentGrad)" />
  </g>

  <!-- White Inner Icon: Speaker & Sound Waves -->
  <!-- Speaker Cone -->
  <path d="M 185 200 L 215 200 L 255 165 C 263 158 275 164 275 175 L 275 265 C 275 276 263 282 255 275 L 215 240 L 185 240 C 177 240 170 233 170 225 L 170 215 C 170 207 177 200 185 200 Z" fill="#0F172A" />

  <!-- Sound Waves -->
  <path d="M 298 195 C 312 208 312 232 298 245" stroke="#0F172A" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 322 175 C 348 198 348 242 322 265" stroke="#0F172A" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- App Title Subtext in Bengali -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">English Partner</text>
</svg>
